name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/verify-vendor.py
      - name: Install and validate rendered examples
        run: |
          python install_local.py --custom-dir "$RUNNER_TEMP/livedeck/custom" --workspace-dir "$RUNNER_TEMP/livedeck/workspaces"
          for deck in "$RUNNER_TEMP/livedeck/custom/live-deck/"*.json "$RUNNER_TEMP/livedeck/custom/live-deck/examples/"*.json; do
            case "$deck" in */deployment.json|*/live-deck.schema.json) continue ;; esac
            node scripts/validate-deck.mjs "$deck"
          done
